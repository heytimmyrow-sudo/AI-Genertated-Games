<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Siege</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <main class="shell">
    <section class="hud-frame">
      <div class="title-block">
        <p class="eyebrow">Top-Down Arena Shooter</p>
        <h1>Neon Siege</h1>
        <p class="subtitle">Choose a run mode, clear waves, grab weapon drops, dodge hazards, pick upgrades, and break through boss rounds.</p>
      </div>
      <canvas id="gameCanvas" width="900" height="600" aria-label="Neon Siege game area"></canvas>
      <div class="controls">
        <span>Move: WASD / Arrows</span>
        <span>Aim: Mouse</span>
        <span>Shoot: Left Click / Space</span>
        <span>Dash: Q / E</span>
        <span>Modes: 1-4</span>
        <span>Upgrades: 1-3</span>
        <span>Start: Enter</span>
        <span>Pause: P</span>
        <span>Restart: R</span>
        <span>Menu: Esc</span>
      </div>
    </section>
  </main>
  <script src="../js/neon-siege.js?v=20260410b"></script>
</body>
</html>
