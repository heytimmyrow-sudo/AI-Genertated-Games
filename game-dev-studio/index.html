<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11131a" />
    <title>Game Dev Studio</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="profiles.css" />
    <link rel="stylesheet" href="projects.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="workspace">
        <header class="topbar">
          <button class="icon-button mobile-menu" id="menuButton" aria-label="Open navigation"></button>
          <div class="crumbs" id="crumbs">Game Dev Studio <span>/</span> Dashboard</div>
          <label class="global-search"><span id="searchIcon"></span><input id="globalSearch" type="search" placeholder="Search projects, data, tools…" /><kbd>⌘ K</kbd></label>
          <div class="top-actions"><button class="icon-button" id="undoButton" title="Undo (Ctrl+Z)"></button><button class="icon-button" id="redoButton" title="Redo (Ctrl+Shift+Z)"></button><button class="avatar profile-button" id="profileButton" aria-label="Manage profiles" title="Manage profiles">+</button></div>
        </header>
        <section class="content" id="content"></section>
      </main>
    </div>
    <div class="modal hidden" id="profileModal" role="dialog" aria-modal="true" aria-labelledby="profileModalTitle">
      <button class="close-modal" id="closeProfileModal" aria-label="Close">×</button>
      <div class="eyebrow">YOUR WORKSPACE</div><h2 id="profileModalTitle">Custom profiles</h2><p>Create profiles for each person who uses this studio on this device.</p>
      <div class="profile-list" id="profileList"></div>
      <form id="profileForm">
        <label>Display name<input id="profileName" required maxlength="32" placeholder="e.g. Alex Rivera" /></label>
        <label>Role or studio name<input id="profileRole" maxlength="42" placeholder="e.g. Lead designer" /></label>
        <label>Profile color<select id="profileColor"><option value="#8395ff">Indigo</option><option value="#45d8d2">Teal</option><option value="#f383c7">Rose</option><option value="#f3ae75">Amber</option><option value="#70d59b">Green</option></select></label>
        <div class="form-actions"><button class="primary-button" type="submit">Save profile</button><button class="secondary-button" type="button" id="newProfile">New profile</button></div>
      </form>
    </div>
    <div class="modal-backdrop hidden" id="modalBackdrop"></div>
    <div class="modal hidden" id="projectModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="close-modal" id="closeModal" aria-label="Close">×</button>
      <div class="eyebrow">NEW PROJECT</div><h2 id="modalTitle">Start a new game</h2><p>Set up a clean workspace. You can change everything later.</p>
      <form id="projectForm">
        <label>Project name<input id="projectName" required maxlength="44" placeholder="e.g. Moonlit Market" /></label>
        <label>Game type<select id="projectType"><option>2D Adventure</option><option>3D Explorer</option><option>Platformer</option><option>RPG</option><option>Custom</option></select></label>
        <div class="template-options" id="templateOptions"><button type="button" class="template selected" data-template="Blank"><span>✦</span>Blank canvas<small>Start from scratch</small></button><button type="button" class="template" data-template="Starter"><span>◫</span>Starter kit<small>Sample player & level</small></button></div>
        <button class="primary-button wide" type="submit">Create project <span>→</span></button>
      </form>
    </div>
    <div class="toast-region" id="toastRegion" aria-live="polite"></div>
    <script src="app.js"></script>
    <script src="profiles.js"></script>
  </body>
</html>
